<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nono t'accompagne — WMG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22242A; --ink2:#4A4E58; --gray:#767C88; --gray-l:#A8ADB7;
  --gold:#D4AF37; --gold-d:#A8861F; --gold-w:#FBF6E7; --gold-b:#EFE3BE;
  --blue:#2D5BFF; --green:#1F8B4D; --green-w:#EAF7EF;
  --bg:#EDEAE4; --white:#fff; --line:#E0DCD4;
  --sh-s:0 1px 2px rgba(34,36,42,.07);
  --sh:0 2px 8px rgba(34,36,42,.09);
  --sh-l:0 10px 34px rgba(34,36,42,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;height:100%}
body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:inherit}
img{display:block;max-width:100%}

/* ══════ EN-TÊTE ══════ */
header{background:var(--white);border-bottom:1px solid var(--line);z-index:30;flex:none}
.hd{display:flex;align-items:center;gap:11px;padding:11px 16px;max-width:720px;margin:0 auto}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold-w);border:1px solid var(--gold-b);
  display:grid;place-items:center;font-size:20px;flex:none}
.who{flex:1;min-width:0}
.who b{display:block;font-size:14.5px;font-weight:800;line-height:1.25}
.who span{font-size:11.5px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px}
.who span i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.jal{font-size:10.5px;font-weight:800;color:var(--gold-d);background:var(--gold-w);
  padding:5px 10px;border-radius:20px;letter-spacing:.3px;flex:none}
.mn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  color:var(--gray);flex:none;transition:.15s}
.mn:hover{background:var(--bg);color:var(--ink)}

/* ══════ FIL ══════ */
.thread{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.inner{max-width:720px;margin:0 auto;padding:18px 14px 22px;display:flex;flex-direction:column;gap:9px}
.day{align-self:center;background:rgba(34,36,42,.06);color:var(--gray);font-size:10.5px;
  font-weight:800;letter-spacing:1px;padding:5px 13px;border-radius:20px;margin:6px 0}

.b{max-width:86%;align-self:flex-start;background:var(--white);border-radius:17px 17px 17px 5px;
  padding:12px 15px;font-size:15px;font-weight:600;line-height:1.55;box-shadow:var(--sh-s);
  animation:pop .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:none}}
.b b{color:var(--gold-d);font-weight:800}
.b .big{display:block;font-family:'Roboto';font-weight:900;font-size:20px;line-height:1.25;
  margin-bottom:5px;color:var(--ink)}
.b .big .g{color:var(--gold-d)}
.b.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:17px 17px 5px 17px;
  font-weight:700;box-shadow:var(--sh)}
.b.me b{color:var(--gold)}
.b.tip{background:var(--gold-w);border:1px solid var(--gold-b);color:#6E5A16;font-size:14px}
.b.warn{background:#FFF4F2;border:1px solid #FBD5CC;color:#8C3A28;font-size:14px}

.shot{align-self:flex-start;max-width:90%;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--sh);cursor:zoom-in;position:relative;background:var(--white);
  animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
.shot img{width:100%}
.shot .zm{position:absolute;bottom:8px;right:8px;background:rgba(34,36,42,.82);color:#fff;
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;backdrop-filter:blur(6px)}
.shot .no{position:absolute;top:8px;left:8px;background:var(--gold);color:#fff;font-size:11px;
  font-weight:800;padding:4px 10px;border-radius:20px}

.embed{align-self:stretch;border-radius:16px;overflow:hidden;border:2px solid var(--gold);
  box-shadow:0 12px 32px rgba(212,175,55,.22);position:relative}
.embed iframe{width:100%;height:min(60vh,520px);border:0;display:block;background:#fff}
.embed .tg{position:absolute;top:9px;left:9px;background:var(--gold);color:#fff;font-size:10px;
  font-weight:800;letter-spacing:.9px;padding:4px 10px;border-radius:20px;z-index:2}

.flow{align-self:stretch;display:flex;align-items:center;gap:4px;background:var(--white);
  border:1px solid var(--line);border-radius:16px;padding:16px 10px;box-shadow:var(--sh-s)}
.flow .c{flex:1;text-align:center}
.flow .c .e{font-size:25px}
.flow .c .n{font-size:9.5px;font-weight:800;color:var(--gray);margin-top:4px}
.flow .a{color:var(--gold);font-weight:800}

.typ{align-self:flex-start;background:var(--white);border-radius:17px;padding:14px 16px;
  display:flex;gap:5px;box-shadow:var(--sh-s)}
.typ i{width:7px;height:7px;border-radius:50%;background:#C3C7CE;animation:tp 1.3s infinite}
.typ i:nth-child(2){animation-delay:.18s} .typ i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* jalon franchi, dans le fil */
.won{align-self:stretch;background:linear-gradient(135deg,#FFFDF6,var(--gold-w));
  border:1.5px solid var(--gold-b);border-radius:18px;padding:20px;text-align:center;
  box-shadow:0 10px 30px rgba(212,175,55,.18);animation:pop .4s cubic-bezier(.2,.9,.3,1.1)}
.won .e{font-size:44px;line-height:1}
.won h3{font-family:'Roboto';font-weight:900;font-size:20px;margin:8px 0 4px}
.won .g{font-size:14.5px;font-weight:800;color:var(--gold-d);margin-bottom:10px}
.won .r{font-size:13px;color:var(--gray);font-weight:700}

/* ══════ BARRE DE RÉPONSE ══════ */
.reply{flex:none;background:var(--white);border-top:1px solid var(--line);
  padding:11px 14px calc(14px + env(safe-area-inset-bottom));z-index:30}
.reply-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.r{border-radius:100px;padding:15px 18px;font-size:15.5px;font-weight:800;text-align:center;
  transition:transform .1s,filter .15s;line-height:1.3}
.r:active{transform:scale(.985)}
.r:hover{filter:brightness(1.04)}
.r.go{background:var(--ink);color:#fff;box-shadow:0 8px 22px rgba(34,36,42,.2)}
.r.ok{background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(31,139,77,.24)}
.r.gold{background:var(--gold);color:#fff;box-shadow:0 8px 22px rgba(212,175,55,.28)}
.r.soft{background:var(--gold-w);border:1.5px solid var(--gold-b);color:var(--ink)}
.r.gh{background:var(--white);border:1.5px solid var(--line);color:var(--ink2)}
.r.gh:hover{border-color:var(--gold)}
.r small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
.tools{display:flex;align-items:center;justify-content:space-between;padding:1px 6px 0}
.tool{font-size:12.5px;font-weight:700;color:var(--gray);padding:4px 2px}
.tool:hover{color:var(--blue)}

/* ══════ MENU / MODALES ══════ */
.ov{position:fixed;inset:0;background:rgba(34,36,42,.6);backdrop-filter:blur(4px);z-index:80;
  display:grid;place-items:end center;animation:fd .22s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.sheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-width:560px;
  max-height:88dvh;overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  animation:sl .3s cubic-bezier(.2,.9,.3,1.05)}
@keyframes sl{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-family:'Roboto';font-weight:900;font-size:20px;margin-bottom:4px}
.sheet .sd{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:16px}
.jl{display:flex;align-items:center;gap:13px;width:100%;padding:12px 13px;border-radius:14px;
  margin-bottom:6px;border:1px solid var(--line);transition:.15s}
.jl:not(.lk):hover{border-color:var(--gold);background:var(--gold-w)}
.jl .i{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-size:16px;background:var(--gold-w)}
.jl.dn .i{background:var(--green-w)} .jl.lk{opacity:.42} .jl.lk .i{background:var(--bg)}
.jl .t{flex:1;min-width:0}
.jl .t b{display:block;font-size:14px;font-weight:800;line-height:1.3}
.jl .t span{font-size:11.5px;color:var(--gray);font-weight:600;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl .m{font-size:10px;font-weight:800;color:var(--gray-l);flex:none}
/* carte usine, envoyée par Nono dans le fil */
.usine{align-self:stretch;background:var(--white);border:1px solid var(--line);border-radius:18px;
  padding:18px 18px 14px;box-shadow:var(--sh-s);animation:pop .3s cubic-bezier(.2,.9,.3,1.1)}
.usine .up{display:flex;align-items:center;gap:16px}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:'Roboto';
  font-weight:900;font-size:17px}
.usine .tt{font-family:'Roboto';font-weight:900;font-size:16px;line-height:1.25}
.usine .ss{font-size:12.5px;color:var(--gray);font-weight:700;margin-top:2px}
.bricks{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:15px;padding-top:13px;
  border-top:1px solid #F0EDE7}
.bricks i{flex:1;border-radius:4px 4px 0 0;background:#E6E2DA;position:relative;transition:.5s}
.bricks i.on{background:linear-gradient(180deg,var(--gold),var(--gold-d))}
.bricks i.now{background:var(--blue);animation:bk 1.8s ease-in-out infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.5}}
.bricks .sm{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:13px;opacity:0}
.bricks .sm.go{opacity:1;animation:fl 2.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.usine .lg{text-align:center;font-size:9.5px;color:var(--gray-l);font-weight:800;
  letter-spacing:.7px;margin-top:8px}
.qa{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:7px}
.qa b{display:block;font-size:14px;margin-bottom:4px}
.qa p{font-size:13.5px;color:var(--gray);line-height:1.5;font-weight:600}
.zoom{position:fixed;inset:0;background:rgba(16,16,20,.95);z-index:90;display:grid;
  place-items:center;padding:14px;cursor:zoom-out;animation:fd .2s}
.zoom img{max-width:100%;max-height:92dvh;border-radius:10px}
.zoom .x{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;opacity:.85}
.cf{position:fixed;top:-14px;font-size:17px;animation:fall 3s linear forwards;
  pointer-events:none;z-index:95}
@keyframes fall{to{transform:translateY(112dvh) rotate(420deg);opacity:.8}}

@media(max-width:560px){
  .hd{padding:10px 13px;gap:9px}
  .inner{padding:14px 11px 18px}
  .b{max-width:89%;font-size:14.5px;padding:11px 14px}
  .b .big{font-size:18px}
  .shot{max-width:94%}
  .r{font-size:15px;padding:14px 16px}
  .embed iframe{height:min(54vh,430px)}
  .jal{font-size:9.5px;padding:4px 8px}
}
</style>
</head>
<body>
<header><div class="hd">
  <div class="av" id="avatar">🤖</div>
  <div class="who"><b id="wName">Nono</b><span><i></i><span id="wState">t'accompagne</span></span></div>
  <div class="jal" id="jTag">0 / 11</div>
  <button class="mn" id="bMenu" title="Sommaire">☰</button>
</div></header>

<div class="thread" id="thread"><div class="inner" id="fil"></div></div>
<div class="reply" id="reply"></div>

<script src="content.js"></script>
<script>
/* ═══════════ DONNÉES ═══════════ */
const KEY='wmg_nono_v1', CH=FORMATION.chapters, N=CH.length;
const NOM=FORMATION.mascot.name||'Nono', FACE=FORMATION.mascot.emoji||'🤖';
let S=lire()||{ch:null,b:0,done:[],flags:{},reponses:{}};
function lire(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=i=>document.getElementById(i), fil=$('fil'), rep=$('reply'), thread=$('thread');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nu=x=>typeof x==='string'?{src:x,cap:''}:x;
const fait=id=>S.done.includes(id);
const libre=c=>c.ready&&(c.id===0||fait(c.id-1)||fait(c.id));
const mn=c=>parseInt((c.duree||'').replace(/\D/g,''))||10;
const resteMn=()=>CH.filter(c=>!fait(c.id)).reduce((a,c)=>a+mn(c),0);

/* ═══════════ SON ═══════════ */
let A;const ac=()=>{try{A=A||new(window.AudioContext||webkitAudioContext);return A}catch(e){return null}};
function bip(f,d,t='sine',v=.07){const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;
  o.connect(g);g.connect(a.destination);const n=a.currentTime;o.start(n);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);o.stop(n+d)}
const pop=()=>bip(620,.05,'sine',.035), okS=()=>{bip(700,.08);setTimeout(()=>bip(920,.12),70)},
      winS=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>bip(f,.2,'triangle',.1),i*105));

/* ═══════════ CONVERSION : étapes → moments du fil ═══════════ */
function beats(c){
  const B=[];
  c.steps.forEach((s,si)=>{
    const titre=s.title||'', msg=s.msg||'';
    const intro=`<span class="big">${titre}</span>${msg}`;
    if(s.slider){
      B.push({t:'dit',h:intro,si});
      s.slider.forEach((x,k)=>{const it=nu(x);
        B.push({t:'montre',img:it.src,no:(k+1)+'/'+s.slider.length,cap:it.cap,si})});
      B.push({t:'valide',si,btns:s.btns,hint:s.hint});
    }else if(s.embed){
      B.push({t:'dit',h:intro,si});
      B.push({t:'embed',src:s.embed,si});
      B.push({t:'valide',si,btns:s.btns,hint:s.hint});
    }else if(s.shot){
      B.push({t:'dit',h:intro,si});
      B.push({t:'montre',img:s.shot,cap:'',si});
      B.push({t:'valide',si,btns:s.btns,hint:s.hint});
    }else if(s.type==='branch'){
      B.push({t:'demande',h:intro,si,btns:s.btns,hint:s.hint});
    }else{
      B.push({t:'dit',h:intro,si,flow:s.flow});
      B.push({t:'valide',si,btns:s.btns,hint:s.hint,doux:true});
    }
    if(s.say)B[B.length-1].say=s.say;
  });
  B.push({t:'fin'});
  return B;
}
let BE=[];

/* ═══════════ RENDU ═══════════ */
function bas(doux=true){requestAnimationFrame(()=>
  thread.scrollTo({top:thread.scrollHeight,behavior:doux?'smooth':'auto'}))}

function head(){
  $('avatar').textContent=FACE; $('wName').textContent=NOM;
  $('jTag').textContent=S.done.length+' / '+N;
  $('wState').textContent=S.ch==null?'t\'accompagne':CH[S.ch].title;
}

function el(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;
  fil.appendChild(d);return d}

function bulle(h,cls=''){pop();return el('b '+cls,h)}
function moi(txt){return el('b me',esc(txt))}
function image(src,no,cap){
  const d=el('shot',`${no?`<span class="no">${no}</span>`:''}<img src="${src}" alt="">
    <span class="zm">🔍 agrandir</span>`);
  d.onclick=()=>zoom(src);
  if(cap)bulle(cap);
  return d;
}
function zoom(src){const d=document.createElement('div');d.className='zoom';
  d.innerHTML=`<span class="x">✕</span><img src="${src}" alt="">`;
  d.onclick=()=>d.remove();document.body.appendChild(d)}
function flowEl(){el('flow',[['🎨','Dessinateur'],['📱','Messager'],['📮','Facteur'],['📷','Instagram']]
  .map((x,k)=>`<div class="c"><div class="e">${x[0]}</div><div class="n">${x[1]}</div></div>`
  +(k<3?'<span class="a">→</span>':'')).join(''))}

/* carte « ton usine se construit » */
function usineEl(){
  const p=S.done.length, pct=Math.round(p/N*100), C=2*Math.PI*29;
  const suite=CH.find(c=>!fait(c.id)&&libre(c));
  const briques=CH.map((c,k)=>{
    const h=42+((k*17)%30), cl=fait(c.id)?'on':(suite&&suite.id===c.id?'now':'');
    const f=(k===N-1)?`<span class="sm${p===N?' go':''}">💨</span>`:'';
    return `<i class="${cl}" style="height:${h}%">${f}</i>`}).join('');
  el('usine',`<div class="up">
    <div class="ring"><svg width="66" height="66">
      <circle cx="33" cy="33" r="29" fill="none" stroke="#E6E2DA" stroke-width="6"/>
      <circle cx="33" cy="33" r="29" fill="none" stroke="#D4AF37" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C-C*pct/100}"
        style="transition:stroke-dashoffset .9s"/></svg><div class="v">${pct}%</div></div>
    <div><div class="tt">${p===N?'Ton usine tourne ! 🎉':'Ton usine se construit'}</div>
      <div class="ss">${p} jalon${p>1?'s':''} sur ${N}${p<N?' · encore ~'+resteMn()+' min':''}</div></div>
  </div><div class="bricks">${briques}</div>
  <div class="lg">CHAQUE JALON CONSTRUIT UNE PIÈCE DE TON USINE</div>`);
}

/* ═══════════ ACCUEIL ═══════════ */
function accueil(){
  fil.innerHTML=''; S.ch=null; head(); save();
  el('day','TON USINE À PUBLICATIONS');
  const p=S.done.length;
  if(p===0){
    bulle(`<span class="big">Salut ! Moi c'est ${NOM} ${FACE}</span>
      Je vais t'accompagner pas à pas pour ouvrir ton usine à publications.`);
    bulle(`On y va tranquillement : je te montre chaque écran, tu me dis quand c'est fait.
      <b>Tu peux t'arrêter et reprendre quand tu veux.</b>`);
  }else if(p===N){
    bulle(`<span class="big">Ton usine tourne ! 🎉</span>
      Tu as franchi les <b>${N} jalons</b>. Ton compte publie maintenant tout seul.`);
    bulle(`Tu peux revoir n'importe quel chapitre avec le menu ☰ en haut à droite.`);
  }else{
    bulle(`<span class="big">Content de te revoir 👋</span>
      Tu as déjà franchi <b>${p} jalon${p>1?'s':''}</b> sur ${N}. Il te reste environ
      <b>${resteMn()} minutes</b> en tout.`);
  }
  usineEl();
  const suite=CH.find(c=>!fait(c.id)&&libre(c));
  if(suite){
    bulle(`Prochaine étape : <b>${esc(suite.title)}</b><br>
      Ce que tu auras à la fin : ${esc(suite.jalon||'')} · ${suite.duree||''}`);
    boutons([{txt:(S.last===suite.id&&S.b>0)?'Reprendre où on en était →':'On commence ! →',
      cls:'gold',go:()=>{if(S.last!==suite.id)S.b=0;ouvrir(suite.id)}}]);
  }else{
    boutons([{txt:'Voir tous les jalons',cls:'gold',go:menu}]);
  }
  bas(false);
}

/* ═══════════ CHAPITRE ═══════════ */
function ouvrir(id){
  S.ch=id;S.last=id;BE=beats(CH[id]);
  if(S.b>=BE.length)S.b=0;
  fil.innerHTML='';head();save();
  const c=CH[id];
  el('day',esc(c.title).toUpperCase()+' · '+(c.duree||''));
  // rejouer l'historique jusqu'à la position (instantané, sans animation d'attente)
  for(let k=0;k<S.b;k++)poser(BE[k],true);
  jouer();
}

function poser(be,muet=false){
  if(be.t==='dit'){const b=bulle(be.h);if(be.flow)flowEl();return b}
  if(be.t==='montre')return image(be.img,be.no,be.cap);
  if(be.t==='embed'){const d=el('embed',
    `<span class="tg">EN DIRECT · DANS LE SITE</span><iframe src="${be.src}" loading="lazy"></iframe>`);
    return d}
  if(be.t==='demande')return bulle(be.h);
  if(be.t==='valide'&&muet){const r=S.reponses[S.ch+'-'+S.b];return null}
  return null;
}

/* joue le moment courant : Nono écrit, puis on propose les réponses */
function jouer(){
  const be=BE[S.b];
  if(!be){accueil();return}
  if(be.t==='fin'){jalon();return}

  if(be.t==='valide'){ // pas de nouveau message : juste les réponses
    reponses(be); bas(); return;
  }
  // Nono "écrit" puis pose son message
  const t=el('typ','<i></i><i></i><i></i>'); bas();
  setTimeout(()=>{
    t.remove(); poser(be);
    if(be.say)bulle(be.say,'tip');
    reponses(be); bas();
  },be.t==='montre'?260:420);
}

/* ═══════════ RÉPONSES ═══════════ */
function boutons(list,outils=true){
  rep.innerHTML='<div class="reply-in">'+list.map((x,k)=>
    `<button class="r ${x.cls||'go'}" data-k="${k}">${x.txt}${x.sub?`<small>${x.sub}</small>`:''}</button>`
  ).join('')+(outils?`<div class="tools">
    <button class="tool" id="tBack">← Revenir en arrière</button>
    <button class="tool" id="tHelp">Je suis bloqué·e ?</button></div>`:'')+'</div>';
  rep.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>list[+b.dataset.k].go());
  const tb=$('tBack'), th=$('tHelp');
  if(tb)tb.onclick=arriere;
  if(th)th.onclick=()=>bloque(list);
}

function reponses(be){
  const av=()=>{S.b++;save();jouer()};
  if(be.t==='montre'){
    const der=BE[S.b+1]&&BE[S.b+1].t!=='montre';
    boutons([{txt:der?'C\'est bon, la suite →':'Écran suivant →',cls:'go',
      go:()=>{pop();av()}}]);
    return;
  }
  if(be.t==='dit'){
    boutons([{txt:'Compris, continue →',cls:'go',go:()=>{pop();av()}}]);
    return;
  }
  if(be.t==='embed'){
    boutons([{txt:'J\'ai fini dans le studio →',cls:'go',go:()=>{pop();av()}}]);
    return;
  }
  if(be.t==='demande'||be.t==='valide'){
    const bs=be.btns||[{label:'C\'est fait ✓',cls:'green'}];
    const map={green:'ok',gold:'gold',primary:'go',ghost:'soft'};
    boutons(bs.map(x=>({txt:x.label,sub:x.sub,cls:map[x.cls]||'soft',go:()=>{
      moi(x.label.replace(/^[✅❌✓✗]\s*/,''));
      if(x.flag)S.flags[x.flag]=true;
      (x.points>=10)?okS():pop();
      // "oui je l'ai déjà" → on saute les étapes correspondantes
      let saut=x.skip||0;
      S.b++;
      if(saut>0){ // avancer jusqu'à passer 'saut' étapes supplémentaires
        const si0=be.si;let cible=si0+saut;
        while(S.b<BE.length&&BE[S.b].t!=='fin'&&BE[S.b].si<=cible)S.b++;
        bulle(`Parfait, on saute cette partie alors 👍`);
      }
      save();setTimeout(jouer,220);
    }})));
    return;
  }
  boutons([{txt:'Continuer →',cls:'go',go:()=>{pop();av()}}]);
}

function arriere(){
  pop();
  if(S.b<=0){accueil();return}
  S.b--; // reculer jusqu'au moment précédent porteur de message
  save();
  ouvrir(S.ch);
}

/* ═══════════ JALON ═══════════ */
function jalon(){
  const c=CH[S.ch], neuf=!fait(c.id);
  if(neuf){S.done.push(c.id);save();winS();
    for(let i=0;i<22;i++){const e=document.createElement('div');e.className='cf';
      e.textContent=['🎉','⭐','✨','🎊','🏆'][i%5];
      e.style.left=Math.random()*100+'vw';e.style.animationDelay=(Math.random()*.5)+'s';
      document.body.appendChild(e);setTimeout(()=>e.remove(),3300)}}
  const r=CH.filter(x=>!fait(x.id)).length;
  el('won',`<div class="e">${c.badge?c.badge.emoji:'🏆'}</div>
    <h3>Jalon franchi !</h3>
    <div class="g">${esc(c.jalon||c.title)}</div>
    <div class="r">${r===0?'Ton usine est complète 🏭'
      :'Encore '+r+' jalon'+(r>1?'s':'')+' · ~'+resteMn()+' min'}</div>`);
  head();
  const suite=CH.find(x=>!fait(x.id)&&libre(x));
  const l=[];
  if(suite)l.push({txt:'Enchaîner : '+esc(suite.title)+' →',cls:'gold',
    go:()=>{S.b=0;ouvrir(suite.id)}});
  l.push({txt:suite?'Faire une pause':'Voir mon usine',cls:'gh',go:()=>{S.b=0;accueil()}});
  boutons(l,false);
  bas();
}

/* ═══════════ SOMMAIRE ═══════════ */
function menu(){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="sheet"><div class="grab"></div>
    <h3>Les ${N} jalons de ton usine</h3>
    <div class="sd">${S.done.length} franchi${S.done.length>1?'s':''} · il te reste ~${resteMn()} min</div>
    ${CH.map(c=>{const d=fait(c.id),ok=libre(c);
      return `<button class="jl ${d?'dn':''} ${ok?'':'lk'}" ${ok?`data-c="${c.id}"`:''}>
        <span class="i">${d?'✓':(ok?c.emoji:'🔒')}</span>
        <span class="t"><b>${esc(c.title)}</b><span>${esc(c.jalon||c.sub||'')}</span></span>
        <span class="m">${c.duree||''}</span></button>`}).join('')}
    <button class="r gh" style="width:100%;margin-top:12px" id="mX">Fermer</button></div>`;
  o.onclick=e=>{if(e.target===o||e.target.id==='mX')o.remove()};
  o.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    o.remove();const id=+b.dataset.c;
    if(S.last!==id)S.b=0;
    S.last=id;ouvrir(id)});
  document.body.appendChild(o);
}

/* ═══════════ AIDE : Nono répond DANS le fil ═══════════ */
const SOUCIS=[
  ['🔍 Je ne trouve pas ce qu\'il faut cliquer',
   be=>[`Pas de souci, c'est le piège le plus courant 😊`,
        `Regarde bien l'image : cherche le <b>même texte</b>, pas la même position. Les sites bougent leurs boutons, mais gardent presque toujours les mêmes mots.`,
        `Astuce : <b>touche l'image</b> pour l'agrandir, tu verras mieux les petits caractères 🔍`]],
  ['🤨 Mon écran ne ressemble pas à l\'image',
   be=>[`C'est possible et ce n'est pas grave — les sites se mettent à jour régulièrement.`,
        `Le plus important, c'est <b>ce qu'on cherche à faire</b>. Si tu trouves un bouton avec un sens équivalent, prends-le : tu es sur la bonne voie.`,
        `Et si tu es vraiment coincé·e, passe cette partie et reviens plus tard — rien ne sera cassé.`]],
  ['😰 J\'ai peur de me tromper',
   be=>[`Tu ne peux rien casser, promis 🤝`,
        `Tout ce qu'on fait ici est <b>annulable</b>. Le pire qui puisse arriver, c'est de refaire une petite étape.`,
        `Et tu peux revenir en arrière autant de fois que tu veux avec « ← Revenir en arrière ».`]],
  ['⏸️ Je veux m\'arrêter et reprendre plus tard',
   be=>[`Bien sûr, prends ton temps !`,
        `Ferme simplement la page. <b>Je garde ta place</b> et on reprendra exactement ici.`,
        `À tout à l'heure 👋`]],
];
function bloque(retour){
  moi('Je suis bloqué·e');
  bas();
  setTimeout(()=>{
    bulle(`Je suis là 🤝 Qu'est-ce qui te bloque ?`);
    const be=BE[S.b]||{};
    const l=SOUCIS.map(([q,f])=>({txt:q,cls:'soft',go:()=>{
      moi(q.replace(/^\S+\s/,''));pop();
      const msgs=f(be); if(be.hint)msgs.push(`💡 ${be.hint}`);
      let i=0;
      const suivant=()=>{
        if(i>=msgs.length){
          bulle(`Ça t'aide ? On reprend où on en était 👇`);
          boutons(retour); bas(); return;
        }
        const t=el('typ','<i></i><i></i><i></i>'); bas();
        setTimeout(()=>{t.remove();bulle(msgs[i++]);bas();suivant()},340);
      };
      rep.innerHTML=''; suivant();
    }}));
    l.push({txt:'Ça va, je continue →',cls:'go',go:()=>{boutons(retour)}});
    boutons(l,false); bas();
  },300);
}

/* ═══════════ DÉMARRAGE ═══════════ */
$('bMenu').onclick=()=>{pop();menu()};
$('avatar').onclick=()=>{pop();S.b=0;accueil()};
if(S.ch!=null&&CH[S.ch]&&!fait(S.ch)){ouvrir(S.ch)}else{S.ch=null;accueil()}
</script>
